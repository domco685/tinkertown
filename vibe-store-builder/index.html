<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Store Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --surface-2: #252525;
      --border: #333;
      --text: #fff;
      --text-secondary: #888;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #22c55e;
      --cream: #faf8f5;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    /* ============ LANDING SCREEN ============ */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s, transform 0.3s;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    #landing {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .landing-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 12px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: white;
    }

    .landing-title {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .landing-subtitle {
      color: var(--text-secondary);
      margin-bottom: 40px;
    }

    .input-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-group input {
      flex: 1;
      background: none;
      border: none;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }

    .input-group input::placeholder {
      color: var(--text-secondary);
    }

    .input-group button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
    }

    .input-group button:active {
      transform: scale(0.95);
    }

    .input-group button svg {
      width: 20px;
      height: 20px;
    }

    /* ============ BUILDER SCREEN ============ */
    #builder {
      background: var(--bg);
    }

    .builder-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
      position: relative;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--surface);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-label {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      flex: 1;
    }

    .product-label strong {
      color: var(--text);
    }

    .progress-badge {
      font-size: 12px;
      padding: 6px 12px;
      background: var(--surface);
      border-radius: 20px;
      color: var(--text-secondary);
    }

    /* Pills */
    .pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 4px;
    }

    .pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 10px 20px;
      border: 1.5px solid var(--border);
      border-radius: 25px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      position: relative;
    }

    .pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .pill.locked::after {
      content: '';
      position: absolute;
      top: -2px;
      right: -2px;
      width: 14px;
      height: 14px;
      background: var(--success);
      border-radius: 50%;
      border: 2px solid var(--bg);
    }

    /* Main content area */
    .builder-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* View toggle (Preview / Chat) */
    .view-container {
      position: absolute;
      inset: 0;
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .view-container.show-chat {
      transform: translateX(-50%);
    }

    .view-panel {
      width: 100%;
      min-width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Preview Panel */
    .preview-panel {
      padding: 16px;
      background: var(--surface);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .layout-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .layout-card:active {
      transform: scale(0.98);
    }

    .layout-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .layout-thumb {
      aspect-ratio: 3/4;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .layout-thumb-inner {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .layout-thumb-header {
      height: 20%;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .layout-thumb-body {
      flex: 1;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .layout-thumb-item {
      background: var(--surface-2);
      border-radius: 3px;
    }

    .layout-name {
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    /* Selected preview */
    .selected-preview {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .selected-preview.visible {
      display: flex;
    }

    .preview-phone {
      flex: 1;
      background: var(--bg);
      border-radius: var(--radius);
      margin: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-phone-header {
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      text-align: center;
    }

    .preview-phone-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .preview-phone-body {
      flex: 1;
      padding: 16px;
    }

    .preview-hero {
      background: var(--surface);
      border-radius: var(--radius-sm);
      height: 120px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-item {
      background: var(--surface);
      border-radius: var(--radius-sm);
      aspect-ratio: 1;
    }

    .preview-actions {
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .preview-action-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .preview-action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding-bottom: 100px;
    }

    .product-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .product-img {
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 13px;
      color: var(--accent);
    }

    /* Brand options */
    .brand-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 100px;
    }

    .brand-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .brand-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand-name {
      font-weight: 600;
    }

    .brand-colors {
      display: flex;
      gap: 6px;
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--bg);
    }

    .brand-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Chat Panel */
    .chat-panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .chat-bubble {
      background: var(--surface);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      padding: 16px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 15px;
    }

    .chat-input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: var(--accent);
    }

    .chat-send {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: linear-gradient(transparent, var(--bg) 20%);
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .view-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
    }

    .view-toggle-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-toggle-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .lock-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lock-btn:disabled {
      background: var(--surface);
      color: var(--text-secondary);
    }

    .lock-btn.locked {
      background: var(--success);
    }

    /* ============ EDITOR SCREEN ============ */
    #editor {
      background: var(--cream);
    }

    .editor-header {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .editor-title {
      font-weight: 600;
      color: #1a1a1a;
    }

    .publish-btn {
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .editor-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .editor-view-container {
      position: absolute;
      inset: 0;
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .editor-view-container.show-chat {
      transform: translateX(-50%);
    }

    .editor-preview-panel {
      width: 100%;
      min-width: 100%;
      overflow-y: auto;
      padding: 16px;
      background: var(--cream);
    }

    .store-preview-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .store-header {
      padding: 24px 16px;
      text-align: center;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
    }

    .store-header h2 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .store-header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .store-featured {
      padding: 20px 16px;
      background: #f5f5f5;
      text-align: center;
    }

    .store-featured h3 {
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .store-featured .price {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .store-products {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .store-product-card {
      background: #f9f9f9;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .store-product-img {
      aspect-ratio: 1;
      background: #eee;
    }

    .store-product-info {
      padding: 12px;
    }

    .store-product-name {
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .store-product-price {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .editor-chat-panel {
      width: 100%;
      min-width: 100%;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .editor-chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .editor-chat-bubble {
      background: #f5f5f5;
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      padding: 16px;
      color: #1a1a1a;
      line-height: 1.5;
    }

    .editor-chat-bubble strong {
      color: var(--accent);
    }

    .editor-chat-input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
    }

    .editor-chat-input-area input {
      flex: 1;
      padding: 14px 16px;
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      border-radius: var(--radius-sm);
      color: #1a1a1a;
      font-size: 15px;
      outline: none;
    }

    .editor-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: linear-gradient(transparent, var(--cream) 20%);
      z-index: 20;
    }

    .editor-view-toggle {
      display: flex;
      background: white;
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .editor-view-toggle-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .editor-view-toggle-btn.active {
      background: var(--accent);
      color: white;
    }

    /* Hidden utility */
    .hidden {
      display: none !important;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeUp 0.4s ease-out;
    }
  </style>
</head>
<body>

  <!-- LANDING SCREEN -->
  <div id="landing" class="screen">
    <div class="landing-content animate-in">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="landing-title">What would you like to sell?</h1>
      <p class="landing-subtitle">Let's build your store together</p>
      <div class="input-group">
        <input type="text" id="product-input" placeholder="candles, jewelry, art prints...">
        <button id="start-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- BUILDER SCREEN -->
  <div id="builder" class="screen hidden">
    <div class="builder-header">
      <div class="header-top">
        <button class="back-btn" id="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="product-label">Building: <strong id="product-name">...</strong></span>
        <span class="progress-badge" id="progress">0/3</span>
      </div>
      <div class="pills">
        <button class="pill active" data-tab="store">Store</button>
        <button class="pill" data-tab="product">Product</button>
        <button class="pill" data-tab="brand">Brand</button>
      </div>
    </div>

    <div class="builder-body">
      <div class="view-container" id="view-container">
        <!-- Preview Panel -->
        <div class="view-panel preview-panel" id="preview-panel">
          <!-- Store layouts -->
          <div id="store-view" class="tab-view">
            <div class="layout-grid" id="layout-grid"></div>
            <div class="selected-preview" id="selected-preview">
              <div class="preview-phone" id="preview-phone"></div>
              <div class="preview-actions">
                <button class="preview-action-btn" id="change-btn">Change layout</button>
              </div>
            </div>
          </div>
          <!-- Product selection -->
          <div id="product-view" class="tab-view hidden">
            <div class="product-grid" id="product-grid"></div>
          </div>
          <!-- Brand selection -->
          <div id="brand-view" class="tab-view hidden">
            <div class="brand-list" id="brand-list"></div>
          </div>
        </div>

        <!-- Chat Panel -->
        <div class="view-panel chat-panel">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button class="chat-send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom bar -->
      <div class="bottom-bar">
        <div class="view-toggle">
          <button class="view-toggle-btn active" data-view="preview">Preview</button>
          <button class="view-toggle-btn" data-view="chat">Chat</button>
        </div>
        <button class="lock-btn" id="lock-btn" disabled>Lock in</button>
      </div>
    </div>
  </div>

  <!-- EDITOR SCREEN -->
  <div id="editor" class="screen hidden">
    <div class="editor-header">
      <span class="editor-title">Your Store</span>
      <button class="publish-btn" id="publish-btn">Publish</button>
    </div>

    <div class="editor-body">
      <div class="editor-view-container" id="editor-view-container">
        <div class="view-panel editor-preview-panel" id="editor-preview-panel">
          <div class="store-preview-card" id="store-preview-card"></div>
        </div>
        <div class="view-panel editor-chat-panel">
          <div class="editor-chat-messages" id="editor-chat-messages"></div>
          <div class="editor-chat-input-area">
            <input type="text" placeholder="Ask me anything...">
            <button class="chat-send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="editor-bottom-bar">
        <div class="editor-view-toggle">
          <button class="editor-view-toggle-btn active" data-view="preview">Preview</button>
          <button class="editor-view-toggle-btn" data-view="chat">Chat</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    const state = {
      productType: '',
      currentTab: 'store',
      currentView: 'preview',
      selectedLayout: null,
      selectedProduct: null,
      selectedBrand: null,
      locked: { store: false, product: false, brand: false }
    };

    // Data
    const layouts = [
      { id: 1, name: 'Minimal', style: 'Clean & simple' },
      { id: 2, name: 'Hero', style: 'Big & bold' },
      { id: 3, name: 'Magazine', style: 'Editorial look' },
      { id: 4, name: 'Classic', style: 'Traditional store' },
      { id: 5, name: 'Modern', style: 'Contemporary feel' },
      { id: 6, name: 'Bold', style: 'Stand out' },
      { id: 7, name: 'Elegant', style: 'Sophisticated' },
      { id: 8, name: 'Playful', style: 'Fun & friendly' }
    ];

    const brands = [
      { id: 1, name: 'Radiant Yellow', colors: ['#FFD700', '#FFA500', '#1a1a1a'], desc: 'Bright, energetic, attention-grabbing' },
      { id: 2, name: 'Ocean Blue', colors: ['#0077B6', '#00B4D8', '#CAF0F8'], desc: 'Calm, trustworthy, professional' },
      { id: 3, name: 'Forest Green', colors: ['#2D6A4F', '#40916C', '#B7E4C7'], desc: 'Natural, sustainable, grounded' },
      { id: 4, name: 'Sunset Pink', colors: ['#FF6B6B', '#FFA07A', '#FFE5E5'], desc: 'Warm, friendly, approachable' },
      { id: 5, name: 'Midnight Purple', colors: ['#7209B7', '#B5179E', '#F8F0FC'], desc: 'Luxurious, creative, unique' }
    ];

    const chatMessages = {
      store: "Pick a layout that feels right. Tap any to select, then we'll set up your products.",
      product: "Now let's add your products. Choose a style that matches your vibe.",
      brand: "Almost done! Pick a color theme that represents your brand."
    };

    // DOM
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // Init
    function init() {
      renderLayouts();
      renderBrands();
      bindEvents();
      updateChat();
    }

    function bindEvents() {
      // Landing
      $('#start-btn').onclick = start;
      $('#product-input').onkeypress = (e) => e.key === 'Enter' && start();

      // Builder
      $('#back-btn').onclick = () => showScreen('landing');
      $$('.pill').forEach(p => p.onclick = () => switchTab(p.dataset.tab));
      $$('.view-toggle-btn').forEach(b => b.onclick = () => switchView(b.dataset.view));
      $('#lock-btn').onclick = lockIn;
      $('#change-btn').onclick = changeLayout;

      // Editor
      $$('.editor-view-toggle-btn').forEach(b => b.onclick = () => switchEditorView(b.dataset.view));
      $('#publish-btn').onclick = () => alert('Store published!');
    }

    function start() {
      const val = $('#product-input').value.trim();
      if (!val) return;
      state.productType = val;
      $('#product-name').textContent = val;
      renderProducts();
      showScreen('builder');
    }

    function showScreen(id) {
      $$('.screen').forEach(s => s.classList.add('hidden'));
      $(`#${id}`).classList.remove('hidden');
    }

    function switchTab(tab) {
      state.currentTab = tab;
      $$('.pill').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
      $$('.tab-view').forEach(v => v.classList.add('hidden'));
      $(`#${tab}-view`).classList.remove('hidden');
      updateChat();
      updateLockBtn();
    }

    function switchView(view) {
      state.currentView = view;
      $$('.view-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      $('#view-container').classList.toggle('show-chat', view === 'chat');
    }

    function switchEditorView(view) {
      $$('.editor-view-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      $('#editor-view-container').classList.toggle('show-chat', view === 'chat');
    }

    function renderLayouts() {
      $('#layout-grid').innerHTML = layouts.map(l => `
        <div class="layout-card" data-id="${l.id}">
          <div class="layout-thumb">
            <div class="layout-thumb-inner">
              <div class="layout-thumb-header"></div>
              <div class="layout-thumb-body">
                <div class="layout-thumb-item"></div>
                <div class="layout-thumb-item"></div>
                <div class="layout-thumb-item"></div>
                <div class="layout-thumb-item"></div>
              </div>
            </div>
          </div>
          <div class="layout-name">${l.name}</div>
        </div>
      `).join('');

      $$('.layout-card').forEach(c => c.onclick = () => selectLayout(+c.dataset.id));
    }

    function renderProducts() {
      const products = [
        { id: 1, name: `Premium ${state.productType}`, price: '$49' },
        { id: 2, name: `Classic ${state.productType}`, price: '$29' },
        { id: 3, name: `Deluxe ${state.productType}`, price: '$79' },
        { id: 4, name: `Mini ${state.productType}`, price: '$19' },
        { id: 5, name: `Bundle pack`, price: '$99' },
        { id: 6, name: `Limited edition`, price: '$149' }
      ];

      $('#product-grid').innerHTML = products.map(p => `
        <div class="product-card" data-id="${p.id}">
          <div class="product-img">Image</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price}</div>
          </div>
        </div>
      `).join('');

      $$('.product-card').forEach(c => c.onclick = () => selectProduct(+c.dataset.id, products));
    }

    function renderBrands() {
      $('#brand-list').innerHTML = brands.map(b => `
        <div class="brand-card" data-id="${b.id}">
          <div class="brand-header">
            <span class="brand-name">${b.name}</span>
            <div class="brand-colors">
              ${b.colors.map(c => `<div class="color-dot" style="background:${c}"></div>`).join('')}
            </div>
          </div>
          <div class="brand-desc">${b.desc}</div>
        </div>
      `).join('');

      $$('.brand-card').forEach(c => c.onclick = () => selectBrand(+c.dataset.id));
    }

    function selectLayout(id) {
      state.selectedLayout = layouts.find(l => l.id === id);
      $$('.layout-card').forEach(c => c.classList.toggle('selected', +c.dataset.id === id));

      // Show preview
      $('#layout-grid').classList.add('hidden');
      $('#selected-preview').classList.add('visible');
      renderPhonePreview();
      updateLockBtn();
      updateChat();
    }

    function changeLayout() {
      state.selectedLayout = null;
      $('#layout-grid').classList.remove('hidden');
      $('#selected-preview').classList.remove('visible');
      $$('.layout-card').forEach(c => c.classList.remove('selected'));
      updateLockBtn();
    }

    function selectProduct(id, products) {
      state.selectedProduct = products.find(p => p.id === id);
      $$('.product-card').forEach(c => c.classList.toggle('selected', +c.dataset.id === id));
      updateLockBtn();
      updateChat();
    }

    function selectBrand(id) {
      state.selectedBrand = brands.find(b => b.id === id);
      $$('.brand-card').forEach(c => c.classList.toggle('selected', +c.dataset.id === id));
      renderPhonePreview();
      updateLockBtn();
      updateChat();
    }

    function renderPhonePreview() {
      const brand = state.selectedBrand || brands[0];
      const name = state.productType.charAt(0).toUpperCase() + state.productType.slice(1);

      $('#preview-phone').innerHTML = `
        <div class="preview-phone-header" style="background: linear-gradient(135deg, ${brand.colors[0]}, ${brand.colors[1]})">
          <h3>${name} Store</h3>
        </div>
        <div class="preview-phone-body">
          <div class="preview-hero">Featured product</div>
          <div class="preview-grid">
            <div class="preview-item"></div>
            <div class="preview-item"></div>
            <div class="preview-item"></div>
            <div class="preview-item"></div>
          </div>
        </div>
      `;
    }

    function updateChat() {
      let msg = chatMessages[state.currentTab];

      if (state.currentTab === 'store' && state.selectedLayout) {
        msg = `Nice! "${state.selectedLayout.name}" is a great choice for ${state.productType}. Lock it in when ready.`;
      } else if (state.currentTab === 'product' && state.selectedProduct) {
        msg = `"${state.selectedProduct.name}" selected! You can add more products later.`;
      } else if (state.currentTab === 'brand' && state.selectedBrand) {
        msg = `${state.selectedBrand.name} - ${state.selectedBrand.desc.toLowerCase()}. Perfect!`;
      }

      $('#chat-messages').innerHTML = `<div class="chat-bubble animate-in">${msg}</div>`;
    }

    function updateLockBtn() {
      const btn = $('#lock-btn');
      const selection = {
        store: state.selectedLayout,
        product: state.selectedProduct,
        brand: state.selectedBrand
      }[state.currentTab];

      const isLocked = state.locked[state.currentTab];

      btn.disabled = !selection || isLocked;
      btn.textContent = isLocked ? 'Locked!' : 'Lock in';
      btn.classList.toggle('locked', isLocked);
    }

    function lockIn() {
      state.locked[state.currentTab] = true;

      // Update pill
      $$(`.pill[data-tab="${state.currentTab}"]`).forEach(p => p.classList.add('locked'));

      // Update progress
      const count = Object.values(state.locked).filter(Boolean).length;
      $('#progress').textContent = `${count}/3`;

      updateLockBtn();

      // Check if done
      if (count === 3) {
        setTimeout(goToEditor, 400);
      } else {
        // Go to next tab
        const tabs = ['store', 'product', 'brand'];
        const next = tabs.find(t => !state.locked[t]);
        if (next) switchTab(next);
      }
    }

    function goToEditor() {
      showScreen('editor');
      renderStorePreview();
      renderEditorChat();
    }

    function renderStorePreview() {
      const brand = state.selectedBrand;
      const name = state.productType.charAt(0).toUpperCase() + state.productType.slice(1);
      const products = [
        { name: `Premium ${state.productType}`, price: '$49' },
        { name: `Classic ${state.productType}`, price: '$29' },
        { name: `Deluxe ${state.productType}`, price: '$79' },
        { name: `Mini ${state.productType}`, price: '$19' }
      ];

      $('#store-preview-card').innerHTML = `
        <div class="store-header" style="background: linear-gradient(135deg, ${brand.colors[0]}, ${brand.colors[1]})">
          <h2>The ${name} Stand</h2>
          <p>Your one-stop shop</p>
        </div>
        <div class="store-featured" style="background: ${brand.colors[2]}">
          <h3>${state.selectedProduct.name}</h3>
          <div class="price" style="color: ${brand.colors[0]}">${state.selectedProduct.price}</div>
        </div>
        <div class="store-products">
          ${products.map(p => `
            <div class="store-product-card">
              <div class="store-product-img"></div>
              <div class="store-product-info">
                <div class="store-product-name">${p.name}</div>
                <div class="store-product-price" style="color: ${brand.colors[0]}">${p.price}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderEditorChat() {
      const name = state.productType.charAt(0).toUpperCase() + state.productType.slice(1);
      const domain = state.productType.toLowerCase().replace(/\s+/g, '') + 'stand.myshopify.com';

      $('#editor-chat-messages').innerHTML = `
        <div class="editor-chat-bubble animate-in">
          I've set up <strong>The ${name} Stand</strong> at <strong>${domain}</strong>.
          What would you like to change?
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
